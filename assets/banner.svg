<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="LuXy Hub — one loader, many games">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="900" height="260" fill="url(#bgGrad)"/>
  <rect width="900" height="260" fill="url(#dots)"/>
  <rect width="900" height="260" fill="url(#glow)"/>
  <rect x="100" y="244" width="700" height="3" rx="1.5" fill="url(#accentLine)"/>
  <text x="450" y="118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="60" font-weight="800" letter-spacing="16" fill="#ffffff">LUXY HUB</text>
  <text x="450" y="162" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" letter-spacing="7" fill="#b3bcc9">ONE LOADER · MANY GAMES · FREE</text>
  <line x1="330" y1="196" x2="570" y2="196" stroke="url(#accentLine)" stroke-width="1.5"/>
  <text x="450" y="226" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" letter-spacing="3" fill="#6e7681">ROBLOX SCRIPT HUB · LUAU · CLEAN CODE</text>
</svg>